# Dynamic configuration intentionally contains only cross-stack transport
# settings. Application routing remains in each application's Swarm labels.
http:
  middlewares:
    traefik-dashboard-auth:
      basicAuth:
        # An htpasswd line lives in the versioned Swarm secret mounted at this
        # path; API/dashboard ports are never published directly.
        usersFile: /run/secrets/traefik_dashboard_auth
        removeHeader: true
