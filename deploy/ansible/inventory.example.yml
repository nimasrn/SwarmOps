---
# Copy this file to deploy/ansible/inventory.yml (ignored by Git). The inventory
# names can be aliases: Docker's actual node name is discovered before labels
# are applied. All hosts must be Linux VMs with SSH, Python 3, and sudo access.

all:
  vars:
    ansible_user: deploy
    ansible_become: true
    # The existing SSH user is granted local Docker CLI access after setup.
    docker_users:
      - "{{ ansible_user }}"
    swarm_primary_manager: manager-01
    swarm_overlay_network: traefik

  children:
    swarm_managers:
      hosts:
        manager-01:
          # Administrative/SSH address. This may be public or reachable only
          # through a VPN or bastion; it is not used for Swarm traffic.
          ansible_host: 203.0.113.11
          # Private address reachable by every Swarm node on TCP 2377.
          swarm_advertise_addr: 10.0.0.11
          swarm_node_labels:
            swarmops.edge: "true"
            swarmops.control: "true"
            swarmops.stateful: "true"

        manager-02:
          ansible_host: 203.0.113.12
          swarm_advertise_addr: 10.0.0.12
          swarm_node_labels: {}

        manager-03:
          ansible_host: 203.0.113.13
          swarm_advertise_addr: 10.0.0.13
          swarm_node_labels: {}
