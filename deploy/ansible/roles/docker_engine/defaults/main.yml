---
# Leave package replacement opt-in. Removing an existing runtime can disrupt a
# host, so a new bootstrap refuses rather than silently replacing it.
docker_remove_conflicting_packages: false
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-compose-v2
  - docker-doc
  - docker-buildx
  - podman-docker
  - containerd
  - runc

docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_users: []
