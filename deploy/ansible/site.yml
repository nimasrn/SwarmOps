---
# This playbook owns host preparation and Swarm formation only. Git-managed
# stacks remain deployed through this repository's Makefile after it finishes.

- name: Provision Docker and form the SwarmOps Docker Swarm
  hosts: swarm_managers
  gather_facts: true
  become: true
  any_errors_fatal: true

  pre_tasks:
    - name: Validate the supported host operating systems
      ansible.builtin.assert:
        that:
          - ansible_facts.os_family == 'Debian'
          - ansible_facts.distribution in ['Debian', 'Ubuntu']
        fail_msg: >-
          This bootstrap supports Debian and Ubuntu only. Provision another
          operating system separately rather than guessing its Docker setup.

    - name: Validate the Swarm inventory shape
      ansible.builtin.assert:
        that:
          - swarm_primary_manager is defined
          - swarm_primary_manager in groups['swarm_managers']
          - swarm_advertise_addr is defined
          - swarm_advertise_addr | string | length > 0
        fail_msg: >-
          Every manager needs a private swarm_advertise_addr, and
          swarm_primary_manager must name a member of swarm_managers.

  roles:
    - role: docker_engine
    - role: swarm
    - role: swarmops_preflight
