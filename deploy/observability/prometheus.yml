global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/swarmops.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [swarmops-alertmanager.swarmops.internal:8081]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: swarmops-api
    metrics_path: /metrics
    static_configs:
      - targets: [swarmops-control.swarmops.internal:8081]

  # Applications SwarmOps renders are discovered rather than configured. The
  # controller serves the target list through Traefik's internal entrypoint, so a
  # newly deployed application starts being scraped without regenerating this
  # file and without giving Prometheus the Docker socket. __metrics_path__ and
  # the application labels come from the discovery response.
  - job_name: swarmops-applications
    http_sd_configs:
      - url: http://swarmops-control.swarmops.internal:8081/metrics/targets?kind=application
        refresh_interval: 30s

  # Hosts and containers. The agents hold no inbound port, so there is nothing
  # for Prometheus to scrape on a node directly: the controller terminates each
  # machine's scrape over the outbound channel that machine already holds open,
  # and serves it at /metrics/machines/<id>. Discovery lists one entry per
  # connected machine, so enrolling a host starts its collection and removing
  # one stops it, with no config to regenerate.
  - job_name: swarmops-machines
    scrape_interval: 15s
    scrape_timeout: 10s
    http_sd_configs:
      - url: http://swarmops-control.swarmops.internal:8081/metrics/targets?kind=machine
        refresh_interval: 30s

  - job_name: traefik
    static_configs:
      - targets: [traefik-metrics.swarmops.internal:8082]

  - job_name: alertmanager
    static_configs:
      - targets: [swarmops-alertmanager.swarmops.internal:8081]
