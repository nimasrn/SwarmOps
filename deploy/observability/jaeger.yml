# Jaeger 2.20 configuration, derived from the release's Badger example. The
# stack pins this single durable store to nim.stateful=true; back up its volume
# before node maintenance. For HA trace storage, replace this config with the
# documented OpenSearch backend in a versioned Swarm config.
service:
  extensions: [jaeger_storage, jaeger_query, healthcheckv2]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [jaeger_storage_exporter]
  telemetry:
    resource:
      service.name: jaeger
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
    logs:
      level: info

extensions:
  healthcheckv2:
    use_v2: true
    http:

  jaeger_query:
    storage:
      traces: primary
      traces_archive: archive

  jaeger_storage:
    backends:
      primary:
        badger:
          directories:
            keys: /var/lib/jaeger/primary
            values: /var/lib/jaeger/primary
          ephemeral: false
          ttl:
            spans: 168h
      archive:
        badger:
          directories:
            keys: /var/lib/jaeger/archive
            values: /var/lib/jaeger/archive
          ephemeral: false
          ttl:
            spans: 720h

receivers:
  otlp:
    protocols:
      grpc:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:

exporters:
  jaeger_storage_exporter:
    trace_storage: primary
