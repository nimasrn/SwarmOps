groups:
  - name: swarmops-control-plane
    rules:
      - alert: SwarmOpsAPIDown
        expr: absent(up{job="swarmops-api"}) or up{job="swarmops-api"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: SwarmOps API is unreachable from Prometheus.

      - alert: TraefikMetricsDown
        expr: absent(up{job="traefik"}) or up{job="traefik"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Traefik metrics are unreachable from Prometheus.

      - alert: AlertmanagerDown
        expr: absent(up{job="alertmanager"}) or up{job="alertmanager"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Alertmanager is unreachable, so notifications may not be delivered.

  - name: swarmops-node-capacity
    rules:
      - alert: SwarmOpsNodeAgentDown
        expr: up{job="swarmops-node-agent"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The SwarmOps node agent is unreachable.

      - alert: SwarmOpsNodeExporterDown
        expr: up{job="node-exporter"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: The node-exporter target is unreachable.

      - alert: SwarmOpsLowDisk
        expr: swarmops_node_disk_bytes_available / swarmops_node_disk_bytes_total < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Swarm node has less than 10 percent free root-disk capacity.

      - alert: SwarmOpsLowMemory
        expr: swarmops_node_memory_bytes_available / swarmops_node_memory_bytes_total < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Swarm node has less than 10 percent available memory.

      - alert: SwarmOpsHighLoad
        expr: swarmops_node_load1 / clamp_min(swarmops_node_cpu_cores, 1) > 1.5
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: A Swarm node has sustained load above 1.5 times its CPU-core count.
