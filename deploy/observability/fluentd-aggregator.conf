<system>
  log_level info
</system>
<source>
  @type forward
  @id swarm_forward
  bind 0.0.0.0
  port 24224
</source>
<filter **>
  @type swarmops_normalize
</filter>
<match **>
  @type file
  path /var/lib/swarmops-logs/records/log
  append true
  path_suffix .jsonl
  symlink_path /var/lib/swarmops-logs/records/current.jsonl
  <format>
    @type json
  </format>
  <buffer time>
    @type file
    path /var/lib/swarmops-logs/buffer/store
    timekey 60s
    timekey_use_utc true
    timekey_wait 5s
    total_limit_size 512m
    chunk_limit_size 8m
    flush_thread_count 2
    retry_forever true
    overflow_action block
  </buffer>
</match>
