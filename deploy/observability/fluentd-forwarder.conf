<system>
  log_level info
</system>
<source>
  @type tail
  @id docker_json
  path /var/lib/docker/containers/*/*.log
  path_key source_path
  pos_file /var/lib/fluentd/cursors/docker.pos
  read_from_head false
  refresh_interval 5
  rotate_wait 5
  tag container
  <parse>
    @type json
    time_key time
    time_type string
    keep_time_key true
  </parse>
</source>
<source>
  @type systemd
  @id persistent_journal
  path /var/log/journal
  tag journal.persistent
  read_from_head false
  <storage>
    @type local
    persistent true
    path /var/lib/fluentd/cursors/journal-persistent.pos
  </storage>
</source>
<source>
  @type systemd
  @id runtime_journal
  path /run/log/journal
  tag journal.runtime
  read_from_head false
  <storage>
    @type local
    persistent true
    path /var/lib/fluentd/cursors/journal-runtime.pos
  </storage>
</source>
<filter {container,journal.**}>
  @type swarmops_normalize
</filter>
<match {container,journal.**}>
  @type forward
  require_ack_response true
  ack_response_timeout 10
  recover_wait 5
  hard_timeout 30
  <server>
    host swarmops-fluentd-forward.swarmops.internal
    port 10024
  </server>
  <buffer tag,time>
    @type file
    path /var/lib/fluentd/buffer/forward
    total_limit_size 512m
    chunk_limit_size 8m
    flush_interval 2s
    flush_thread_count 2
    retry_type exponential_backoff
    retry_max_interval 30
    retry_forever true
    overflow_action block
  </buffer>
</match>
