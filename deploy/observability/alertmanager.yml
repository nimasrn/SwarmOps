# This baseline keeps alert grouping and inhibition deterministic without
# embedding an external endpoint or credential in Git. Before treating alerts
# as an operational notification channel, replace this immutable config with a
# reviewed receiver configuration and mount any receiver credential as a Swarm
# secret. The default receiver deliberately discards notifications.
global:
  resolve_timeout: 5m

route:
  receiver: blackhole
  group_by: [alertname, job, instance]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: blackhole
