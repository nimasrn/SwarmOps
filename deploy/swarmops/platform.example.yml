# Non-secret SwarmOps platform preflight manifest. Copy it outside Git for a
# real environment, replace the sample capacity values with current inventory,
# and point every credentialSecret at an externally created Swarm secret.
apiVersion: swarmops.nim.zone/v1alpha1
kind: Platform
namespace: production

registry:
  # Use ghcr or private. Private mode requires authSecret; no registry
  # credential is ever written into this manifest.
  mode: ghcr
  host: ghcr.io
  namespace: nimasrn

build:
  # These labels identify reviewed build/cache capacity. Admission checks them
  # before the controlled build workflow; routing a generic build to a remote
  # builder remains a separate execution decision.
  nodeLabel: nim.build
  cacheNodeLabel: nim.cache

ingress:
  # Replace with the real public IP(s) routed to Traefik before deploying Jitsi
  # or choosing the HTTP-01 certificate resolver.
  publicIPs: [198.51.100.10]

dns:
  providers:
    - name: cloudflare
      type: cloudflare
      credentialSecret: traefik_cf_dns_token_v1
    - name: arvan
      type: arvancloud
      credentialSecret: traefik_arvan_api_key_v1
  resolvers:
    - name: le
      challenge: dns
      provider: cloudflare
    - name: arvan
      challenge: dns
      provider: arvan
    - name: http
      challenge: http

storage:
  - name: primary
    endpoint: https://s3.example.com
    bucket: swarmops-backups
    credentialSecret: swarmops_s3_primary_v1

backup:
  provider: primary
  prefix: swarmops/production
  schedule: "15 3 * * *"

# This is a capacity snapshot, not a desired node declaration. Refresh it from
# the inventory before every deploy and add the labels only after node roles are
# deliberately assigned.
nodes:
  - name: node-01
    cpuCores: 8
    availableCPUCores: 6
    memoryMiB: 16384
    availableMemoryMiB: 12288
    availableDiskGiB: 400
    labels:
      nim.build: "true"
      nim.cache: "true"
      nim.mongo: "true"
      nim.mongo.slot: "1"
      nim.postgres: "true"
      nim.postgres.slot: primary
      nim.redis: "true"
      nim.jitsi: "true"
      nim.observability: "true"
  - name: node-02
    cpuCores: 8
    availableCPUCores: 6
    memoryMiB: 16384
    availableMemoryMiB: 12288
    availableDiskGiB: 400
    labels:
      nim.mongo: "true"
      nim.mongo.slot: "2"
      nim.postgres: "true"
      nim.postgres.slot: replica
      nim.redis: "true"
  - name: node-03
    cpuCores: 8
    availableCPUCores: 6
    memoryMiB: 16384
    availableMemoryMiB: 12288
    availableDiskGiB: 400
    labels:
      nim.mongo: "true"
      nim.mongo.slot: "3"
      nim.redis: "true"

workloads:
  - name: mongo
    profile: mongo-replicaset
    replicas: 3
  - name: postgres
    profile: postgres-primary-replica
    replicas: 2
  - name: redis
    profile: redis-sentinel
    replicas: 3
  - name: jitsi
    profile: jitsi
    replicas: 1
    domain: meet.example.com
    resolver: le
    advertiseIP: 198.51.100.10
    objectStorageProvider: primary
  - name: observability
    profile: observability
    replicas: 1

  # Application-profile workloads are the slots SwarmOps can render and deploy
  # from the console. The name, domain, resolver, and resource ceiling are
  # reviewed here; the operator then chooses only the image and the managed
  # databases to attach. An application cannot claim a domain or a budget that
  # is not written below.
  - name: vlora-backend
    profile: application
    replicas: 1
    domain: api.vlora.ir
    resolver: le
    resources:
      cpuCores: 2
      memoryMiB: 1024
      diskGiB: 10
  - name: vlora-app
    profile: application
    replicas: 1
    domain: vlora.ir
    resolver: le
    resources:
      cpuCores: 1
      memoryMiB: 512
      diskGiB: 5
