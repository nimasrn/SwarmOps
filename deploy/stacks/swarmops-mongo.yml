# Managed MongoDB. Reviewed, checked-in stateful stack; the console chooses
# only whether it runs. The root password is a Swarm secret that SwarmOps
# generates on the manager and never returns to a browser.
version: "3.9"

services:
  mongo:
    image: ${MONGO_IMAGE:-mongo:8.2.3}
    command: ["mongod", "--bind_ip_all", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: swarmops
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo_password
      MONGO_INITDB_DATABASE: swarmops
    secrets:
      - source: mongo_password
        target: mongo_password
        mode: 0400
    volumes:
      - swarmops_mongo_data:/data/db
    networks: [swarmops-data]
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.nim.stateful == true
      update_config:
        order: stop-first
        parallelism: 1
      restart_policy:
        condition: any
        delay: 10s
      resources:
        reservations:
          cpus: "0.25"
          memory: 512M
        limits:
          cpus: "2.00"
          memory: 2048M

networks:
  swarmops-data:
    external: true
    name: swarmops-data

volumes:
  swarmops_mongo_data:

secrets:
  mongo_password:
    external: true
    name: ${SWARMOPS_MONGO_PASSWORD_SECRET:-swarmops_mongo_password_v1}
