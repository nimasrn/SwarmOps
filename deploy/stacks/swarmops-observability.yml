# Internal collection and alerting for the Swarm. SwarmOps renders the small
# operator-facing graphs itself; Prometheus, Alertmanager, and Jaeger remain
# available only through typed internal Traefik routes.
version: "3.9"

services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v3.14.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle=false
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0444
      - source: prometheus_rules
        target: /etc/prometheus/rules/swarmops.yml
        mode: 0444
    volumes:
      - swarmops_prometheus:/prometheus
    networks: [route-prometheus]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.nim.stateful == true
      restart_policy:
        condition: any
      resources:
        reservations:
          cpus: "0.20"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 1536M

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-prom/alertmanager:v0.33.1}
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    configs:
      - source: alertmanager_config
        target: /etc/alertmanager/alertmanager.yml
        mode: 0444
    volumes:
      - swarmops_alertmanager:/alertmanager
    networks: [route-alertmanager]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.nim.stateful == true
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 512M

  jaeger:
    image: ${JAEGER_IMAGE:-jaegertracing/jaeger:2.20.0}
    command: ["--config=/etc/jaeger/config.yml"]
    configs:
      - source: jaeger_config
        target: /etc/jaeger/config.yml
        mode: 0444
    volumes:
      - swarmops_jaeger:/var/lib/jaeger
    networks: [route-jaeger]
    read_only: true
    tmpfs: [/tmp]
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.labels.nim.stateful == true
      restart_policy:
        condition: any
      resources:
        reservations:
          cpus: "0.20"
          memory: 512M
        limits:
          cpus: "1.00"
          memory: 1536M

networks:
  route-prometheus:
    external: true
    name: swarmops-route-swarmops-observability-prometheus-efd3b86d
  route-alertmanager:
    external: true
    name: swarmops-route-swarmops-observability-alertmanager-48422d25
  route-jaeger:
    external: true
    name: swarmops-route-swarmops-observability-jaeger-b3ab6686

volumes:
  swarmops_prometheus:
  swarmops_alertmanager:
  swarmops_jaeger:

configs:
  prometheus_config:
    external: true
    name: ${SWARMOPS_PROMETHEUS_CONFIG_NAME:-swarmops_prometheus_config_v1}
  prometheus_rules:
    external: true
    name: ${SWARMOPS_PROMETHEUS_RULES_CONFIG_NAME:-swarmops_prometheus_rules_v1}
  alertmanager_config:
    external: true
    name: ${SWARMOPS_ALERTMANAGER_CONFIG_NAME:-swarmops_alertmanager_config_v1}
  jaeger_config:
    external: true
    name: ${SWARMOPS_JAEGER_CONFIG_NAME:-swarmops_jaeger_config_v1}
