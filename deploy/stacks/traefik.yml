# Shared Swarm edge. Deploy first, after creating the external traefik overlay
# plus versioned Cloudflare DNS-token and ArvanCloud API-key secrets.
version: "3.9"

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6.13}
    command:
      - --configFile=/etc/traefik/traefik.yml
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/traefik_cf_dns_token
      ARVANCLOUD_API_KEY_FILE: /run/secrets/traefik_arvan_api_key
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/data
    configs:
      - source: traefik_static
        target: /etc/traefik/traefik.yml
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    secrets:
      - source: traefik_cf_dns_token
        target: traefik_cf_dns_token
        mode: 0400
      - source: traefik_arvan_api_key
        target: traefik_arvan_api_key
        mode: 0400
      - source: traefik_dashboard_auth
        target: traefik_dashboard_auth
        mode: 0400
    networks: [traefik]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.nim.edge == true
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.swarm.network=traefik
        - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.nim.zone}`)
        - traefik.http.routers.traefik-dashboard.entrypoints=websecure
        - traefik.http.routers.traefik-dashboard.tls.certresolver=le
        - traefik.http.routers.traefik-dashboard.service=api@internal
        - traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth@file
        - traefik.http.routers.traefik-dashboard-http.rule=Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.nim.zone}`)
        - traefik.http.routers.traefik-dashboard-http.entrypoints=web
        - traefik.http.routers.traefik-dashboard-http.service=noop@internal
        - traefik.http.routers.traefik-dashboard-http.middlewares=traefik-dashboard-https
        - traefik.http.middlewares.traefik-dashboard-https.redirectscheme.scheme=https
        - traefik.http.middlewares.traefik-dashboard-https.redirectscheme.permanent=true

networks:
  traefik:
    external: true
    name: traefik

volumes:
  traefik_acme:

configs:
  traefik_static:
    external: true
    name: ${TRAEFIK_STATIC_CONFIG_NAME:-swarmops_traefik_static_v1_0000000000000000}
  traefik_dynamic:
    file: ../traefik/dynamic.yml
    name: ${TRAEFIK_DYNAMIC_CONFIG_NAME:-nim_traefik_dynamic_v1}

secrets:
  traefik_cf_dns_token:
    external: true
    name: ${TRAEFIK_CF_DNS_TOKEN_SECRET:-traefik_cf_dns_token_v1}
  traefik_arvan_api_key:
    external: true
    name: ${TRAEFIK_ARVAN_API_KEY_SECRET:-traefik_arvan_api_key_v1}
  traefik_dashboard_auth:
    external: true
    name: ${TRAEFIK_DASHBOARD_AUTH_SECRET:-traefik_dashboard_auth_v1}
