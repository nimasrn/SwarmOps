# Shared Swarm edge. Deploy first, after creating the external traefik overlay
# plus versioned Cloudflare DNS-token and ArvanCloud API-key secrets.
version: "3.9"

services:
  traefik:
    image: ${TRAEFIK_IMAGE:-traefik:v3.6.13}
    command:
      - --log.level=INFO
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=true
      - --ping=true
      - --metrics.prometheus=true
      - --metrics.prometheus.entrypoint=metrics
      - --providers.swarm.endpoint=unix:///var/run/docker.sock
      - --providers.swarm.exposedbydefault=false
      - --providers.swarm.network=traefik
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.metrics.address=:8082
      - --certificatesresolvers.le.acme.email=${TRAEFIK_ACME_EMAIL:?set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/data/acme.json
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      # Dedicated resolver names let a reviewed app choose its DNS authority
      # without exposing provider credentials in the app stack. A single
      # resolver has one DNS provider; use a CNAME delegation when one domain
      # must be validated through another authority.
      - --certificatesresolvers.arvan.acme.email=${TRAEFIK_ACME_EMAIL:?set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.arvan.acme.storage=/data/acme-arvan.json
      - --certificatesresolvers.arvan.acme.dnschallenge.provider=arvancloud
      - --certificatesresolvers.http.acme.email=${TRAEFIK_ACME_EMAIL:?set TRAEFIK_ACME_EMAIL}
      - --certificatesresolvers.http.acme.storage=/data/acme-http.json
      - --certificatesresolvers.http.acme.httpchallenge.entrypoint=web
    environment:
      CF_DNS_API_TOKEN_FILE: /run/secrets/traefik_cf_dns_token
      ARVANCLOUD_API_KEY_FILE: /run/secrets/traefik_arvan_api_key
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_acme:/data
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic.yml
    secrets:
      - source: traefik_cf_dns_token
        target: traefik_cf_dns_token
        mode: 0400
      - source: traefik_arvan_api_key
        target: traefik_arvan_api_key
        mode: 0400
      - source: traefik_dashboard_auth
        target: traefik_dashboard_auth
        mode: 0400
    networks: [traefik]
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.nim.edge == true
      update_config:
        order: stop-first
        parallelism: 1
        failure_action: rollback
        monitor: 30s
      rollback_config:
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
      resources:
        reservations:
          cpus: "0.10"
          memory: 128M
        limits:
          cpus: "0.50"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.traefik-dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.nim.zone}`)
        - traefik.http.routers.traefik-dashboard.entrypoints=websecure
        - traefik.http.routers.traefik-dashboard.tls.certresolver=le
        - traefik.http.routers.traefik-dashboard.service=api@internal
        - traefik.http.routers.traefik-dashboard.middlewares=traefik-dashboard-auth@file
        - traefik.http.routers.traefik-dashboard-http.rule=Host(`${TRAEFIK_DASHBOARD_HOST:-traefik.nim.zone}`)
        - traefik.http.routers.traefik-dashboard-http.entrypoints=web
        - traefik.http.routers.traefik-dashboard-http.service=noop@internal
        - traefik.http.routers.traefik-dashboard-http.middlewares=traefik-dashboard-https
        - traefik.http.middlewares.traefik-dashboard-https.redirectscheme.scheme=https
        - traefik.http.middlewares.traefik-dashboard-https.redirectscheme.permanent=true

networks:
  traefik:
    external: true
    name: traefik

volumes:
  traefik_acme:

configs:
  traefik_dynamic:
    file: ../traefik/dynamic.yml
    name: ${TRAEFIK_DYNAMIC_CONFIG_NAME:-nim_traefik_dynamic_v1}

secrets:
  traefik_cf_dns_token:
    external: true
    name: ${TRAEFIK_CF_DNS_TOKEN_SECRET:-traefik_cf_dns_token_v1}
  traefik_arvan_api_key:
    external: true
    name: ${TRAEFIK_ARVAN_API_KEY_SECRET:-traefik_arvan_api_key_v1}
  traefik_dashboard_auth:
    external: true
    name: ${TRAEFIK_DASHBOARD_AUTH_SECRET:-traefik_dashboard_auth_v1}
