name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Go
        run: |
          go test ./...
          go vet ./...

      - name: Verify web console
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm audit --omit=dev --audit-level=high

      - name: Verify deployment assets
        run: |
          make docs-check
          make stack-check-all TAG=ci

      - name: Build container targets
        run: |
          docker build --target api --tag swarmops-api:ci .
          docker build --target agent --tag swarmops-agent:ci .
          docker build --target cli --tag swarmops-cli:ci .
